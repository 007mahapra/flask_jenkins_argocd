apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/007mahapra/flask_jenkins_argocd
    targetRevision: main
    path: k8s                   # where the manifests live
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true               # remove resources deleted from git
      selfHeal: true            # revert any manual cluster changes