name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'        # only trigger if app code changes
      - 'Dockerfile'    # or Dockerfile changes

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: write       # needed to git push the tag update back
      packages: write       # needed to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # allows pushing back to repo

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}  # built-in, no setup needed

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}//flask_jenkins_argocd:${{ github.run_number }}

      - name: Update image tag in k8s/deployment.yaml
        run: |
          sed -i 's|image: ghcr.io/.*/flask_jenkins_argocd:.*|image: ghcr.io/${{ github.repository_owner }}//flask_jenkins_argocd:${{ github.run_number }}|' k8s/deployment.yaml
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add k8s/deployment.yaml
          git commit -m "ci: update image tag to ${{ github.run_number }}"
          git push